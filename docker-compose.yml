# Default stack: API + Streamlit UI with the in-process transformers LLM.
#
# Optional inference profiles:
#   - Ollama (CPU or GPU):  docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#   - vLLM (NVIDIA GPU):    docker compose -f docker-compose.yml -f docker-compose.vllm.yml up -d
#
# Copy .env.example to .env and set RAG_SECRET_KEY (and RAG_ADMIN_PASSWORD if
# you want a fixed first-boot admin password).

services:
  api:
    build: .
    image: enterprise-rag/api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./backups:/app/backups
    environment:
      # Required: the api container refuses to start without a strong secret,
      # so an unset RAG_SECRET_KEY (missing .env) fails loudly instead of
      # silently signing tokens with a known key.
      RAG_SECRET_KEY: ${RAG_SECRET_KEY}
      RAG_ADMIN_USERNAME: ${RAG_ADMIN_USERNAME:-admin}
      RAG_ADMIN_PASSWORD: ${RAG_ADMIN_PASSWORD:-}
      RAG_LLM_BACKEND: ${RAG_LLM_BACKEND:-transformers}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-http://ollama:11434}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-google/flan-t5-base}
      RAG_PIPELINE_CACHE_SIZE: ${RAG_PIPELINE_CACHE_SIZE:-8}
      RAG_QUERY_RATE_LIMIT_MAX: ${RAG_QUERY_RATE_LIMIT_MAX:-30}
      RAG_QUERY_RATE_LIMIT_WINDOW_SECONDS: ${RAG_QUERY_RATE_LIMIT_WINDOW_SECONDS:-60}
      RAG_MAX_UPLOAD_MB: ${RAG_MAX_UPLOAD_MB:-50}
      RAG_PBKDF2_ITERATIONS: ${RAG_PBKDF2_ITERATIONS:-600000}
      RAG_GROUNDING_CHECK: ${RAG_GROUNDING_CHECK:-1}
      RAG_GROUNDING_MIN_OVERLAP: ${RAG_GROUNDING_MIN_OVERLAP:-0.5}
      RAG_GROUNDING_MIN_TOKENS: ${RAG_GROUNDING_MIN_TOKENS:-4}
      RAG_AUDIT_LOG_RETENTION_DAYS: ${RAG_AUDIT_LOG_RETENTION_DAYS:-365}
      RAG_LOGIN_MAX_FAILURES: ${RAG_LOGIN_MAX_FAILURES:-5}
      RAG_LOGIN_MAX_FAILURES_PER_IP: ${RAG_LOGIN_MAX_FAILURES_PER_IP:-20}
      RAG_LOGIN_FAILURE_WINDOW_SECONDS: ${RAG_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      RAG_CORS_ORIGINS: ${RAG_CORS_ORIGINS:-}
      RAG_GLOBAL_RATE_LIMIT_MAX: ${RAG_GLOBAL_RATE_LIMIT_MAX:-120}
      RAG_TOKEN_TTL_SECONDS: ${RAG_TOKEN_TTL_SECONDS:-43200}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ui:
    build: .
    image: enterprise-rag/ui:latest
    command: ["streamlit", "run", "app/ui/streamlit_app.py",
              "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    environment:
      RAG_API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: alpine:3.19
    command: ["/bin/bash", "/scripts/cron-entrypoint.sh"]
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./scripts:/scripts:ro
    environment:
      RAG_DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    restart: unless-stopped
    profiles:
      - backup
