name: CI

on:
  push:
    branches: [main, v1.1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ tests/ --select E,F,W --ignore E501,W505,E402

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
        env:
          RAG_SECRET_KEY: test-secret-ci-pipeline-2024-abcdef
          RAG_ALLOW_INSECURE_DEV_KEY: "1"
          RAG_PBKDF2_ITERATIONS: "1000"
          RAG_QUERY_RATE_LIMIT_MAX: "1000000"

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1.1'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enterprise-rag/api:ci-${{ github.sha }} .
